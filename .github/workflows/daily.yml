name: Daily Slip

on:
  schedule:
    # GitHub schedules run in UTC; the app works out Eastern time itself.
    - cron: "*/15 14-23 * * *"   # daytime: 11 AM / 3 PM scan windows + injury news every 15 min
    - cron: "*/15 0-6 * * *"     # evening: grade games + injury news every 15 min
    - cron: "0 9 * * *"          # final grading pass
  workflow_dispatch:
    inputs:
      mode:
        description: "auto (normal), grade (free), watch (injury news, free) or scan (spends credits if today isn't locked)"
        default: auto
        type: choice
        options: [auto, grade, watch, scan]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-slip
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
    env:
      TZ: America/New_York
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      SLIP_PASSWORD: ${{ secrets.SLIP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet requests python-dotenv flask cryptography

      - name: Unlock data
        run: python publish.py decrypt

      - name: Scan, grade and watch injuries
        run: python sports_app.py --${{ github.event.inputs.mode || 'auto' }}

      - name: Lock data and rebuild page
        run: python publish.py encrypt

      - name: Save
        id: save
        run: |
          git config user.name "daily-slip-bot"
          git config user.email "daily-slip-bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Update $(date '+%Y-%m-%d %H:%M %Z')"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Publish straight from this run (pushes made by this job don't start other workflows)
      - if: steps.save.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - if: steps.save.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - if: steps.save.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
